<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi QRCode</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-fingerprint"></i> Sistem Absensi QRCode</h1>
            <div class="status" id="status">Scan QRCode untuk absen</div>
        </header>

        <div class="main-content">
            <!-- Video Scanner -->
            <div class="scanner-container" id="scannerContainer">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="canvas" style="display: none;"></canvas>
                <div class="scanner-overlay">
                    <div class="scan-frame"></div>
                    <p>Posisikan QRCode di dalam kotak</p>
                </div>
            </div>

            <!-- Hasil Absensi -->
            <div class="result-container" id="resultContainer" style="display: none;">
                <div class="result-success" id="resultSuccess">
                    <i class="fas fa-check-circle"></i>
                    <h3 id="absenStatus"></h3>
                    <p id="absenDetail"></p>
                    <button onclick="startScanner()" class="btn-scan-again">
                        <i class="fas fa-camera"></i> Scan Lagi
                    </button>
                </div>
            </div>

            <!-- Loading -->
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Memverifikasi absensi...</p>
            </div>
        </div>

        <!-- Daftar Absensi Hari Ini -->
        <div class="attendance-list">
            <h3><i class="fas fa-list"></i> Absensi Hari Ini</h3>
            <div id="attendanceList"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="script.js"></script>
</body>
</html>
